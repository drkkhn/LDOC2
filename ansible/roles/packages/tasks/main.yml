- name: Update apt cache
  apt:
    update_cache: yes

- name: Install system packages
  apt:
    name:
      - curl
      - wget
      - git
      - nginx
      - postgresql
      - ufw
      - docker.io
      - rsync
      - tar
      - python3-pip
    state: present

- name: Allow OpenSSH
  ufw:
    rule: allow
    name: OpenSSH

- name: Allow HTTP
  ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Allow HTTPS
  ufw:
    rule: allow
    port: "443"
    proto: tcp

- name: Enable UFW
  ufw:
    state: enabled
